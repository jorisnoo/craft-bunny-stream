name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.5']
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, gd, intl, mbstring, pdo_mysql, zip
          tools: composer:v2
          coverage: none
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: composer check

  required:
    name: Package checks
    if: always()
    needs: php
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every PHP job to pass
        env:
          RESULT: ${{ needs.php.result }}
        run: test "$RESULT" = success
