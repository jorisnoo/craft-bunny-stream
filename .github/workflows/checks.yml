name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            database: postgres:16
            port: 5432
            dsn: pgsql:host=127.0.0.1;port=5432;dbname=stream_test
            health: pg_isready -U stream -d stream_test
          - php: '8.5'
            database: mysql:8.4
            port: 3306
            dsn: mysql:host=127.0.0.1;port=3306;dbname=stream_test
            health: mysqladmin ping -h localhost
    services:
      database:
        image: ${{ matrix.database }}
        env:
          POSTGRES_DB: stream_test
          POSTGRES_USER: stream
          POSTGRES_PASSWORD: local-test
          MYSQL_DATABASE: stream_test
          MYSQL_USER: stream
          MYSQL_PASSWORD: local-test
          MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
        ports:
          - 127.0.0.1:${{ matrix.port }}:${{ matrix.port }}
        options: >-
          --health-cmd "${{ matrix.health }}" --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      TEST_DB_DSN: ${{ matrix.dsn }}
      TEST_DB_USER: stream
      TEST_DB_PASSWORD: local-test
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, gd, intl, mbstring, pdo_mysql, pdo_pgsql, zip
          tools: composer:v2
          coverage: none
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: composer check

  required:
    name: Package checks
    if: always()
    needs: php
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every PHP job to pass
        env:
          RESULT: ${{ needs.php.result }}
        run: test "$RESULT" = success
